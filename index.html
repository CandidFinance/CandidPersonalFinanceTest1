    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: 'DM Sans', sans-serif; background: #faf7f0; }
      /* A visible focus ring for keyboard users everywhere, over the inline
         outline:none many fields set. Not on elements focused only by script
         (tabindex -1: a question's heading, a dialog's box), though still on
         a button that's tabindex -1 (a PillSlider's arrow-key options). A money pill
         shows it round the whole pill, not the scaled field inside. */
      :focus-visible:not([tabindex="-1"]), button:focus-visible { outline: 2px solid #162f24 !important; outline-offset: 2px; }
      [tabindex="-1"]:not(button):focus { outline: none; }
      .pill-field:focus-within { outline: 2px solid #162f24; outline-offset: 2px; }
      .pill-field input:focus-visible { outline: none !important; }
      /* An empty answer on Edit inputs (fieldState.js): "Add" in GOLD_TEXT. */
      .pill-empty input::placeholder { color: #8a6a24; opacity: 1; }
      /* An empty answer on Edit inputs: a slow sheen across its gold. */
      @keyframes field-sheen { 0%, 55% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
      .field-empty { background-image: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%) !important; background-size: 250% 100% !important; background-repeat: no-repeat !important; animation: field-sheen 4.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .field-empty { animation: none; background-image: none !important; } }
      /* The answer a link to Edit inputs was for: a gold ring that fades
         (.q-flash), or, reached from a link in another tile, stays until they
         go back (.q-ring). Drawn a little way out from the answer, inside the
         tile's padding, so it rings the pills rather than running into them. */
      @keyframes q-flash { from { outline-color: rgba(196,150,58,0.55); } to { outline-color: rgba(196,150,58,0); } }
      .q-flash, .q-ring { outline: 3.5px solid rgba(196,150,58,0.55); outline-offset: 8px; }
      .q-flash { animation: q-flash 1.2s ease-out 0.15s both; }
      @media (prefers-reduced-motion: reduce) { .q-flash { animation: none; } }
      /* A small round button's tap area, 44px, without changing how it looks. */
      .tap44 { position: relative; }
      .tap44::before { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
      /* Reduced motion: CSS transitions and smooth scrolling off (framer-motion
         animations follow MotionConfig reducedMotion="user" in main.jsx). */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0s !important; }
      }
    </style>
