/* ------------------------------------------------------------------
   Tax engine: 2026/27, England, Wales and Northern Ireland rates
   ------------------------------------------------------------------ */
const PA = 12570, BASIC_BAND = 37700, ADDITIONAL = 125140, TAPER_START = 100000;
const NI_PT = 12570, NI_UEL = 50270;

function incomeTax(totalIncome, rasGross) {
  const ani = totalIncome - rasGross;
  const pa = Math.max(0, PA - Math.max(0, ani - TAPER_START) / 2);
  const taxable = Math.max(0, totalIncome - pa);
  const b = BASIC_BAND + rasGross, a = ADDITIONAL + rasGross;
  const tax = 0.2 * Math.min(taxable, b) + 0.4 * Math.max(0, Math.min(taxable, a) - b) + 0.45 * Math.max(0, taxable - a);
  return { ani, pa, tax };
}
const ni = pay => 0.08 * Math.max(0, Math.min(pay, NI_UEL) - NI_PT) + 0.02 * Math.max(0, pay - NI_UEL);

// pension = gross amount into the pension per month, for either method
function model({ salary, pension, method }) {
  const annual = pension * 12;
  const sac = method === 'sacrifice' ? annual : 0;
  const rasGross = method === 'ras' ? annual : 0;
  const rasNet = rasGross * 0.8;
  const pay = salary - sac;
  const t = incomeTax(pay, rasGross);
  const n = ni(pay);
  return { ...t, ni: n, pay, annual, rasNet, takeHome: pay - t.tax - n - rasNet };
}
function compare(params) {
  const base = model({ ...params, pension: 0 });
  const now = model(params);
  return {
    base, now,
    taxCut: base.tax - now.tax,
    niCut: base.ni - now.ni,
    takeHomeChange: now.takeHome - base.takeHome,
    paRestored: now.pa - base.pa,
  };
}
function band(ani) {
  if (ani > ADDITIONAL) return { label: 'Additional rate', rate: 45, ni: 2 };
  if (ani > TAPER_START) return { label: 'Allowance taper band', rate: 60, ni: 2 };
  if (ani > NI_UEL) return { label: 'Higher rate', rate: 40, ni: 2 };
  if (ani > PA) return { label: 'Basic rate', rate: 20, ni: 8 };
  return { label: 'Personal allowance', rate: 0, ni: 0 };
}
function mortgagePayment(balance, years, ratePct) {
  const r = ratePct / 100 / 12, n = years * 12;
  return r === 0 ? balance / n : balance * r / (1 - Math.pow(1 + r, -n));
}

const gbp = n => (n < -0.5 ? '-' : '') + '£' + Math.round(Math.abs(n)).toLocaleString('en-GB');
const methodName = m => (m === 'ras' ? 'relief at source' : 'salary sacrifice');
const nowStamp = () => new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const timeOnly = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

const reducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function matchQuestion(text) {
  const t = text.toLowerCase();
  if (/350|take.?home|modelled impact/.test(t)) return 'impact';
  if (/sacrifice|relief at source|personal pension|difference/.test(t)) return 'methods';
  if (/childcare|nursery|funded hours|30 hours/.test(t)) return 'childcare';
  if (/adjusted net|\bani\b/.test(t)) return 'ani';
  if (/125/.test(t)) return 'cliff';
  if (/self assessment|tax return|higher.?rate relief/.test(t)) return 'sa';
  if (/bonus/.test(t)) return 'bonus';
  if (/mortgage|fixed rate|remortgage/.test(t)) return 'mortgage';
  if (/tax year|5 april|year end/.test(t)) return 'yearend';
  if (/100k|100,000|taper|allowance|tax/.test(t)) return 'taper';
  return 'fallback';
}

function buildSummary(params, topics, saved) {
  const c = compare(params);
  const gap = c.now.ani - TAPER_START;
  return [
    'SAVED SCENARIO SUMMARY',
    `Generated: ${nowStamp()}`,
    'Source: Candid guidance chat (modelled figures, 2026/27 rates, England, Wales and NI)',
    '',
    'Inputs',
    `- Salary: ${gbp(params.salary)}`,
    `- Pension contribution: ${gbp(params.pension)} a month (${gbp(params.pension * 12)} a year), ${methodName(params.method)}`,
    '',
    'Modelled figures',
    `- Adjusted net income: ${gbp(c.now.ani)} (no contribution: ${gbp(c.base.ani)})`,
    `- Personal allowance: ${gbp(c.now.pa)} (no contribution: ${gbp(c.base.pa)})`,
    `- Modelled income tax reduction: ${gbp(c.taxCut)} a year`,
    `- Modelled National Insurance reduction: ${gbp(c.niCut)} a year`,
    `- Take-home change: ${gbp(c.takeHomeChange)} a year`,
    `- Childcare income test (£100,000 per parent): ${gap > 0 ? `${gbp(gap)} above` : `${gbp(-gap)} below`}`,
    '',
    `Topics explored: ${topics.length ? topics.join('; ') : 'none yet'}`,
    `Saved scenarios in notes: ${saved.length}`,
    '',
    'These figures are modelled from the inputs above using published rates. They are not a personal recommendation, and tax rules can change.',
  ].join('\n');
}

    `Amount I am modelling: ${gbp(amount)} a month (${gbp(amount * 12)} a year)`,

    'Questions',

    '- Is there a minimum salary after sacrifice, or a limit on the amount?',
    '- When can an arrangement start or change, and is bonus sacrifice available?',
    '- Does the employer add any of its National Insurance saving to the pension?',
    '- Which salary figure is used for life cover, income protection and pay reviews?',
  ].join('\n');
}

/* ------------------------------------------------------------------
   Small UI pieces
   ------------------------------------------------------------------ */
function Flash({ value, children, className = '' }) {
  return <span key={String(value)} className={`flash ${className}`}>{children}</span>;
}

function Stat({ label, value, sub, tone }) {
  const toneCls = tone === 'ok' ? 'text-ok' : tone === 'warn' ? 'text-warn' : 'text-ink';
  return (
    <div className="flex flex-col gap-0.5 min-w-0">
      <dt className="text-xs text-mute leading-snug">{label}</dt>
      <dd className={`font-serif text-xl num ${toneCls}`}><Flash value={value}>{value}</Flash></dd>
      {sub && <dd className="text-xs text-mute">{sub}</dd>}
    </div>
  );
}

function Slider({ id, label, min, max, step, value, onChange, display, hint }) {
  return (
    <div className="flex flex-col gap-1">
      <div className="flex items-baseline justify-between gap-3">
        <label htmlFor={id} className="text-sm text-ink">{label}</label>
        <span className="font-serif text-lg num text-pine">{display}</span>
      </div>
      <input id={id} type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(Number(e.target.value))} />
      {hint && <div className="flex justify-between text-[11px] text-mute num">{hint.map(h => <span key={h}>{h}</span>)}</div>}
    </div>
  );
}

function Segmented({ id, options, value, onChange, label }) {
  return (
    <div role="radiogroup" aria-label={label} className="inline-flex rounded-lg border border-line bg-cream p-0.5 text-sm">
      {options.map(o => (
        <button key={o.value} id={`${id}-${o.value}`} type="button" role="radio" aria-checked={value === o.value}

function ChildcareStatus({ ani }) {
  const ok = ani <= TAPER_START;
  const gap = Math.abs(ani - TAPER_START);
  return (
    <div className={`flex items-start gap-3 rounded-lg px-3 py-2.5 ${ok ? 'bg-oksoft' : 'bg-warnsoft'}`}>
      <span className={`mt-1 h-2.5 w-2.5 shrink-0 rounded-full ${ok ? 'bg-ok' : 'bg-warn'}`} aria-hidden="true"></span>

        <span className="font-semibold">Childcare income test: {ok ? 'within the £100,000 limit' : 'above the £100,000 limit'}.</span>{' '}
        <span className="text-mute">Modelled adjusted net income is <span className="num">{gbp(gap)}</span> {ok ? 'below' : 'above'} the line. Applies to each parent separately.</span>
      </p>
    </div>
  );
}

function AniScale({ ani, base }) {
  const lo = 75000, hi = 135000;
  const pct = v => Math.min(100, Math.max(0, (v - lo) / (hi - lo) * 100));
  return (
    <div className="pt-1" aria-label={`Adjusted net income ${gbp(ani)} on a scale from ${gbp(lo)} to ${gbp(hi)}`}>
      <div className="relative h-3 rounded-full bg-cream border border-line">
        <div className="absolute top-0 bottom-0 bg-goldsoft border-x border-gold/60" style={{ left: pct(TAPER_START) + '%', width: (pct(ADDITIONAL) - pct(TAPER_START)) + '%' }}></div>
        {Math.abs(base - ani) > 1 && (
          <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 h-3 w-3 rounded-full border-2 border-mute bg-paper" style={{ left: pct(base) + '%' }} title="No contribution"></div>

        <span className="absolute -translate-x-1/2" style={{ left: pct(TAPER_START) + '%' }}>£100,000</span>
        <span className="absolute -translate-x-1/2" style={{ left: pct(ADDITIONAL) + '%' }}>£125,140</span>
      </div>

function ExplainToggle({ on, onChange, id }) {
  return (
    <Segmented id={id} label="Explanation style" value={on ? 'eli5' : 'standard'} onChange={v => onChange(v === 'eli5')}
      options={[{ value: 'standard', label: 'Standard' }, { value: 'eli5', label: 'ELI5: plain English' }]} />
  );
}

function AiMessage({ msg, onDone, onProgress }) {
  const r = RESPONSES[msg.rid];
  const words = useMemo(() => r.text.map(p => p.split(' ')), [r]);
  const total = words.reduce((a, w) => a + w.length, 0);
  const [shown, setShown] = useState(msg.done ? total : 0);
  const [thinking, setThinking] = useState(!msg.done);
  const [eli5, setEli5] = useState(false);

  useEffect(() => {
    if (msg.done) return;
    if (reducedMotion()) { setShown(total); setThinking(false); onDone(); return; }
    let n = 0, iv;
    const t = setTimeout(() => {
      setThinking(false);
      iv = setInterval(() => {
        n += 3; setShown(Math.min(n, total)); onProgress();
        if (n >= total) { clearInterval(iv); onDone(); }
      }, 28);
    }, 600);
    return () => { clearTimeout(t); clearInterval(iv); };
  }, []);

  const complete = shown >= total;
  const Widget = r.widget ? WIDGETS[r.widget] : null;
  let left = shown;
  const paras = eli5 && complete ? r.eli5 : words.map(w => { const k = Math.min(left, w.length); left -= k; return w.slice(0, k).join(' '); }).filter(Boolean);

  return (
    <article className="flex gap-3 items-start">
      <div className="h-8 w-8 shrink-0 rounded-full bg-pine text-cream grid place-items-center font-serif text-sm" aria-hidden="true">C</div>
      <div className="flex-1 min-w-0 flex flex-col gap-3">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <span className="text-xs font-semibold text-pine">Candid guidance</span>
          {complete && <ExplainToggle id={`eli-${msg.id}`} on={eli5} onChange={setEli5} />}
        </div>
        {thinking ? (
          <div className="flex gap-1 py-2" aria-label="Writing a response">
            <span className="dot h-1.5 w-1.5 rounded-full bg-mute"></span><span className="dot h-1.5 w-1.5 rounded-full bg-mute"></span><span className="dot h-1.5 w-1.5 rounded-full bg-mute"></span>
          </div>
        ) : (
          <div className={`flex flex-col gap-2.5 text-[15px] leading-relaxed max-w-[68ch] ${eli5 && complete ? 'border-l-2 border-gold pl-3' : ''}`}>
            {paras.map((p, i) => <p key={i}>{p}</p>)}
          </div>
        )}
        {complete && Widget && <Widget />}
      </div>
    </article>
  );
}

function UserMessage({ text }) {

      <p className="max-w-[80%] rounded-2xl rounded-br-md bg-pine text-cream px-4 py-2.5 text-[15px] leading-snug">{text}</p>

}

function ChatPane({ threadKey, heightClass = 'h-[680px]', showTests = true, placeholder = 'Ask about tax, pensions or childcare' }) {
  const { threads, ask, markDone } = useStore();
  const messages = threads[threadKey] || [];
  const scroller = useRef(null);
  const [draft, setDraft] = useState('');
  const toBottom = useCallback(() => { const el = scroller.current; if (el) el.scrollTop = el.scrollHeight; }, []);
  useEffect(() => { requestAnimationFrame(toBottom); }, [messages.length]);
  const lastAi = [...messages].reverse().find(m => m.role === 'ai');
  const chips = lastAi && lastAi.done ? RESPONSES[lastAi.rid].chips : [];
  const streaming = lastAi && !lastAi.done;

  return (
    <div className={`flex flex-col ${heightClass} min-h-[420px] bg-paper border border-line rounded-xl overflow-hidden`}>
      <div ref={scroller} className="scroll-soft flex-1 overflow-y-auto px-4 sm:px-6 py-5 flex flex-col gap-6" aria-live="polite">
        {messages.length === 0 && <p className="text-sm text-mute">Ask a question, or pick a test question below.</p>}
        {messages.map(m => m.role === 'user'
          ? <UserMessage key={m.id} text={m.text} />
          : <AiMessage key={m.id} msg={m} onDone={() => markDone(threadKey, m.id)} onProgress={toBottom} />)}
      </div>
      <div className="border-t border-line bg-cream/70 px-3 sm:px-4 py-3 flex flex-col gap-2.5">
        {chips.length > 0 && (
          <div className="flex flex-wrap gap-2" aria-label="Explore further">
            {chips.map(c => (
              <button key={c.label} type="button" onClick={() => ask(threadKey, c.label, c.rid)}
                className="rounded-full border border-gold/70 bg-paper px-3 py-1.5 text-xs text-pine hover:bg-goldsoft transition-colors">
                {c.label}
              </button>
            ))}
          </div>
        )}
        <form className="flex gap-2" onSubmit={e => { e.preventDefault(); const t = draft.trim(); if (t && !streaming) { ask(threadKey, t); setDraft(''); } }}>
          <label htmlFor={`in-${threadKey}`} className="sr-only">Ask a question</label>
          <input id={`in-${threadKey}`} value={draft} onChange={e => setDraft(e.target.value)} placeholder={placeholder}
            className="flex-1 min-w-0 rounded-lg border border-line bg-paper px-3 py-2 text-sm placeholder:text-mute/80 focus:outline-none focus:border-gold" />
          <button type="submit" disabled={streaming || !draft.trim()}
            className="inline-flex items-center gap-1.5 rounded-lg bg-pine px-3.5 py-2 text-sm text-cream disabled:opacity-40">
            <Icon name="send" size={15} /><span className="hidden sm:inline">Send</span>
          </button>
        </form>
        {showTests && (
          <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-xs">
            <span className="text-mute font-medium">Test questions</span>
            {TEST_QUESTIONS.map(q => (
              <button key={q.rid} type="button" disabled={streaming} onClick={() => ask(threadKey, q.text, q.rid)}
                className="text-left text-pine underline decoration-gold/60 underline-offset-2 hover:decoration-gold disabled:opacity-40">
                {q.text}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function FormatSprint({ goChat }) {

          </div>

              <li key={x.title} className="flex-1">

          {s.ask && (
            <button type="button" onClick={() => goChat(s.ask)} className="inline-flex items-center gap-1.5 px-2 py-2 text-sm text-pine underline decoration-gold/60 underline-offset-2">
              <Icon name="chat" size={15} />Explore this in chat
            </button>
          )}
          <div className="ml-auto">
            {step < SPRINT.length - 1 ? (
              <button type="button" onClick={() => go(step + 1)} className="inline-flex items-center gap-1 rounded-lg bg-pine px-4 py-2 text-sm text-cream">Next<Icon name="right" size={15} /></button>

            )}
          </div>
        </div>
      </div>
    </div>
  );

const MODAL_META = {
  summary: { title: 'Saved Scenario Summary', note: 'Export preview. Copy the text to keep it.' },

function Modal({ kind, text, onClose }) {
  const [value, setValue] = useState(text);
  const [status, setStatus] = useState('');
  const ta = useRef(null);
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const copy = async () => {
    try { await navigator.clipboard.writeText(value); setStatus('Copied'); }
    catch (e) { if (ta.current) { ta.current.focus(); ta.current.select(); } setStatus('Text selected: press Ctrl+C or Cmd+C to copy'); }
  };
  const meta = MODAL_META[kind];
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-pine/40" onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-labelledby="modal-title" className="w-full max-w-xl rounded-xl bg-paper border border-line shadow-xl flex flex-col max-h-[90%]" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-3 px-5 pt-4">
          <div>
            <h3 id="modal-title" className="font-semibold text-pine">{meta.title}</h3>
            <p className="text-xs text-mute">{meta.note}</p>
          </div>
          <button type="button" onClick={onClose} className="p-1 text-mute hover:text-ink" aria-label="Close"><Icon name="x" size={18} /></button>
        </div>
        <div className="px-5 py-3 flex-1 min-h-0">
          <label htmlFor="modal-text" className="sr-only">{meta.title}</label>
          <textarea id="modal-text" ref={ta} value={value} onChange={e => setValue(e.target.value)} readOnly={kind !== 'hr'}
            className="w-full h-72 rounded-lg border border-line bg-white p-3 font-mono text-xs leading-relaxed text-ink focus:outline-none focus:border-gold" />
        </div>
        <div className="px-5 pb-4 flex items-center gap-3">
          <button type="button" onClick={copy} className="inline-flex items-center gap-1.5 rounded-lg bg-pine px-3.5 py-2 text-sm text-cream"><Icon name="copy" size={15} />Copy text</button>
          <span className="text-xs text-mute" role="status">{status}</span>
        </div>
      </div>
    </div>
  );
}

const FORMATS = [
  { id: 'thread', n: 1, label: 'Hybrid thread', sub: 'Inline modellers', icon: 'chat' },
  { id: 'split', n: 2, label: 'Split screen', sub: 'Chat plus living canvas', icon: 'columns' },
  { id: 'sprint', n: 3, label: 'Guided sprint', sub: 'One concept per step', icon: 'steps' },
  { id: 'timeline', n: 4, label: 'Timeline feed', sub: 'Milestone threads', icon: 'clock' },
];

function App() {
  const initialTab = () => { try { const h = location.hash.slice(1); return FORMATS.some(f => f.id === h) ? h : 'thread'; } catch (e) { return 'thread'; } };
  const [tab, setTab] = useState(initialTab);
  const [params, setParams] = useState(DEFAULT_PARAMS);
  const [threads, setThreads] = useState({
    f1: [{ id: 'a1', role: 'user', text: Q.taper }, { id: 'a2', role: 'ai', rid: 'taper', done: true }],
    f2: [{ id: 'b1', role: 'user', text: Q.impact }, { id: 'b2', role: 'ai', rid: 'impact', done: true }],
    't-sa': [{ id: 'c1', role: 'ai', rid: 'sa', done: true }],
  });
  const [topics, setTopics] = useState(['Personal allowance taper', 'Pension contribution at £350/mo', 'Claiming higher-rate relief']);
  const [saved, setSaved] = useState([]);
  const [audit, setAudit] = useState([{ id: 'l0', t: new Date(), kind: 'Session started', detail: 'Example profile loaded (salary £110,000)' }]);
  const [modal, setModal] = useState(null);

  useEffect(() => {
    const on = () => { const h = location.hash.slice(1); if (FORMATS.some(f => f.id === h)) setTab(h); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const choose = id => { setTab(id); try { location.hash = id; } catch (e) {} };

  const log = useCallback((kind, detail) => setAudit(a => [...a, { id: uid(), t: new Date(), kind, detail }]), []);
  const addTopic = useCallback(t => { if (t) setTopics(ts => ts.includes(t) ? ts : [...ts, t]); }, []);

  // Debounce slider logging so one drag makes one audit entry
  const pending = useRef({});
  const setParam = useCallback((k, v) => {
    setParams(p => ({ ...p, [k]: v }));
    clearTimeout(pending.current[k]);
    pending.current[k] = setTimeout(() => {
      const shown = k === 'salary' ? gbp(v) : k === 'pension' ? `${gbp(v)}/mo` : methodName(v);
      log('Input changed', `${k === 'method' ? 'Method' : k[0].toUpperCase() + k.slice(1)} set to ${shown}`);
    }, 700);
  }, [log]);

  const ask = useCallback((key, label, rid) => {
    const id = rid || matchQuestion(label);
    const r = RESPONSES[id];
    if (r.effect) setParams(p => ({ ...p, ...r.effect(p) }));
    addTopic(r.topic);
    log('Question asked', label);
    setThreads(t => ({ ...t, [key]: [...(t[key] || []), { id: uid(), role: 'user', text: label }, { id: uid(), role: 'ai', rid: id, done: false }] }));
  }, [log, addTopic]);
  const seedThread = useCallback((key, rid) => setThreads(t => ({ ...t, [key]: [{ id: uid(), role: 'ai', rid, done: false }] })), []);
  const markDone = useCallback((key, id) => setThreads(t => ({ ...t, [key]: (t[key] || []).map(m => m.id === id ? { ...m, done: true } : m) })), []);

  const paramsRef = useRef(params);
  paramsRef.current = params;
  const saveScenario = useCallback(context => {
    const p = paramsRef.current, c = compare(p);
    const line = `${gbp(p.salary)} salary, ${gbp(p.pension)}/mo ${methodName(p.method)}; adjusted net income ${gbp(c.now.ani)}; modelled tax reduction ${gbp(c.taxCut)}/yr`;
    setSaved(s => [...s, { id: uid(), t: new Date(), context, line }]);
    log('Saved to notes', `${context}: ${line}`);
  }, [log]);
  const removeSaved = id => { setSaved(s => s.filter(x => x.id !== id)); log('Note removed', 'A saved scenario was removed'); };

  const openModal = kind => {
    const text = kind === 'hr' ? buildHr(params) : kind === 'audit' ? buildAudit(audit) : buildSummary(params, topics, saved);
    log(kind === 'hr' ? 'HR details opened' : kind === 'audit' ? 'Audit record viewed' : 'Summary exported', MODAL_META[kind].title);
    setModal({ kind, text });
  };

  const goChat = chip => { ask('f1', chip.label, chip.rid); choose('thread'); };

  const store = { params, setParam, threads, ask, seedThread, markDone, topics, addTopic, saved, saveScenario, removeSaved, audit, log, openModal };
  const reset = () => { setParams(DEFAULT_PARAMS); log('Inputs reset', 'Example profile restored'); };

  return (
    <Store.Provider value={store}>
      <div className="min-h-full flex flex-col">
        <header className="bg-pine text-cream">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-3">
            <span className="font-serif text-xl font-bold tracking-tight">Candid</span>
            <span className="text-cream/40" aria-hidden="true">/</span>
            <span className="text-sm text-cream/90">Guidance chat formats</span>
            <span className="ml-auto text-[11px] uppercase tracking-wider text-gold font-semibold">Mockup</span>
          </div>
        </header>

        <nav className="bg-paper border-b border-line" aria-label="Chat formats">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 grid grid-cols-2 md:grid-cols-4 gap-1 py-2">
            {FORMATS.map(f => (
              <button key={f.id} type="button" onClick={() => choose(f.id)} aria-current={tab === f.id ? 'page' : undefined}
                className={`flex items-start gap-2.5 rounded-lg px-3 py-2 text-left transition-colors ${tab === f.id ? 'bg-cream ring-1 ring-gold/70' : 'hover:bg-cream/70'}`}>
                <Icon name={f.icon} size={18} className={`mt-0.5 shrink-0 ${tab === f.id ? 'text-gold' : 'text-mute'}`} />
                <span className="min-w-0">
                  <span className="block text-sm font-semibold text-ink">Format {f.n}: {f.label}</span>
                  <span className="block text-xs text-mute truncate">{f.sub}</span>
                </span>
              </button>
            ))}
          </div>
        </nav>

        <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 pt-4">
          <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-mute">
            <span className="inline-flex items-center gap-1.5"><Icon name="info" size={14} />Example profile, shared by all four formats:</span>
            <span className="num text-ink">Salary {gbp(params.salary)}</span>
            <span className="num text-ink">Pension {gbp(params.pension)}/mo, {methodName(params.method)}</span>
            <span className="num text-ink">Two children under 4</span>
            <button type="button" onClick={reset} className="inline-flex items-center gap-1 text-pine underline decoration-gold/60 underline-offset-2"><Icon name="rotate" size={13} />Reset inputs</button>
          </div>
        </div>

        <main className="max-w-6xl mx-auto w-full px-4 sm:px-6 py-5 flex-1">
          {tab === 'thread' && <FormatThread />}
          {tab === 'split' && <FormatSplit />}
          {tab === 'sprint' && <FormatSprint goChat={goChat} />}
          {tab === 'timeline' && <FormatTimeline />}
        </main>

        <footer className="border-t border-line bg-paper">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 text-xs text-mute leading-relaxed">
            Candid is a calculator and guidance tool, not a regulated adviser. Figures are modelled from the inputs shown using 2026/27 income tax and National Insurance rates for England, Wales and Northern Ireland; Scottish income tax bands differ. Nothing here is a personal recommendation. Responses in this mockup are scripted.
          </div>
        </footer>
      </div>
      {modal && <Modal kind={modal.kind} text={modal.text} onClose={() => setModal(null)} />}
    </Store.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
